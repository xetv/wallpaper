<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xetya Wallpapers — Bali</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101114;color:#f5f5f5}
*{box-sizing:border-box}body{margin:0}header{padding:28px 5vw 18px}h1{margin:0;font-size:clamp(1.5rem,4vw,2.4rem)}p{color:#b8bbc4;margin:.45rem 0}
main{padding:0 5vw 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
article{overflow:hidden;border:1px solid #333640;border-radius:14px;background:#191a20}
article img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#25262c}
.caption{padding:10px 12px}.caption strong{display:block;font-size:.98rem}.caption small{color:#b8bbc4}
footer{padding:20px 5vw;color:#a8abb5;font-size:.85rem}
</style>
</head>
<body>
<header><h1>Xetya Wallpapers</h1><p>Koleksi wallpaper Bali untuk Projectivy Launcher · Overflight</p><p id="status">Memuat koleksi…</p></header>
<main><section class="grid" id="gallery"></section></main>
<footer>Daftar sumber: <a href="./wallpapers.json" style="color:inherit">wallpapers.json</a></footer>
<script>
(async()=>{
 const status=document.querySelector('#status'), gallery=document.querySelector('#gallery');
 try{
  const response=await fetch('./wallpapers.json',{cache:'no-store'});
  if(!response.ok) throw new Error('HTTP '+response.status);
  const items=await response.json();
  for(const item of items){
   const card=document.createElement('article'), img=document.createElement('img'), caption=document.createElement('div'), title=document.createElement('strong'), author=document.createElement('small');
   img.src=item.url_img; img.alt=item.title||'Wallpaper'; img.loading='lazy';
   title.textContent=item.title||'Wallpaper'; author.textContent=item.location||'Xetya Wallpapers';
   caption.className='caption'; caption.append(title,author); card.append(img,caption); gallery.append(card);
  }
  status.textContent=items.length+' wallpaper tersedia';
 }catch(e){status.textContent='Gagal memuat koleksi: '+e.message}
})();
</script>
</body></html>
